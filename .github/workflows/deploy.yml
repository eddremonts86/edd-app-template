name: deploy

# Production deploy: trigger Coolify, then wait for the result.
#
# A workflow that only queues the build reports green while production breaks,
# so this polls until the deployment reaches a terminal state and fails the job
# on anything but `finished`.
#
# Unconfigured is a supported state, the same way it is for every integration in
# this template (docs/architecture/integration-conventions.md §1): a clone with
# no Coolify secrets skips with an explanation instead of turning the Actions
# tab red on day one.
#
# Setup — resolve the UUID by name, never reuse a stored one:
#   curl -s -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
#     "$COOLIFY_API_URL/api/v1/applications" | jq -r '.[] | "\(.uuid) \(.name)"'
# then set the three repository secrets below. A stored UUID points at whichever
# app was provisioned last, and deploying to the wrong one succeeds silently.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Two pushes in quick succession should not race each other into Coolify.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check the deploy is configured
        id: guard
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          missing=""
          [ -z "$COOLIFY_API_URL" ] && missing="$missing COOLIFY_API_URL"
          [ -z "$COOLIFY_API_TOKEN" ] && missing="$missing COOLIFY_API_TOKEN"
          [ -z "$COOLIFY_APP_UUID" ] && missing="$missing COOLIFY_APP_UUID"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — missing repository secret(s):$missing"
            echo "Set them to enable deployment. See README → Deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the deployment
        id: trigger
        if: steps.guard.outputs.configured == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail

          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "${COOLIFY_API_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")

          if [ "$status" = "429" ]; then
            echo "::error::Coolify is rate-limiting deploys (429). Re-run this job rather than hammering it."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::Coolify returned HTTP $status"
            cat "$response"
            exit 1
          fi

          # `deployment_uuid` is optional — DeployController omits it when
          # nothing was queued. No id means there is nothing to wait on, and
          # reporting success on that is exactly how a broken deploy goes green.
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' "$response")

          if [ -z "$deployment_uuid" ]; then
            echo "::error::Coolify queued nothing — no deployment_uuid in the response."
            cat "$response"
            exit 1
          fi

          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Queued deployment $deployment_uuid"

      - name: Wait for the deployment to finish
        if: steps.guard.outputs.configured == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          # The whole set, from app/Enums/ApplicationDeploymentStatus.php:
          # queued, in_progress, finished, failed, cancelled-by-user.
          # Note the hyphen, and note that `error` and `success` are not among
          # them — a workflow that waits on invented names polls until timeout
          # and then blames the timeout.
          for attempt in $(seq 1 120); do
            status=$(curl -sS \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "${COOLIFY_API_URL%/}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              | jq -r '.status // "unknown"')

            case "$status" in
              finished)
                echo "✅ Deployment finished"
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "::error::Deployment $status"
                exit 1
                ;;
              queued|in_progress)
                echo "  … $status ($attempt/120)"
                ;;
              *)
                echo "::warning::Unrecognised status '$status' — treating as pending"
                ;;
            esac

            sleep 10
          done

          echo "::error::Deployment did not reach a terminal state within 20 minutes"
          exit 1
