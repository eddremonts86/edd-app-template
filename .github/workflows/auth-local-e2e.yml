name: auth-local-e2e

# No `paths` filter, and `dev` alongside `main`.
#
# This is a required status check. A filtered workflow simply does not run when
# a pull request touches none of its paths, the required check never reports,
# and the pull request can never be merged — the check is not "passed", it is
# permanently pending. The filter saved about ninety seconds and could deadlock
# every merge that did not happen to touch auth.
on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

jobs:
  auth-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No `version:` — the action reads `packageManager` from package.json.
      # Pinning both makes the action refuse to run on a mismatch, which is how
      # this workflow failed while `quality.yml`, already fixed, passed.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run auth-local E2E suite
        run: pnpm test:e2e:auth-local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-auth-local
          path: playwright-report
          if-no-files-found: ignore
